<div class="auth-page">
  <div class="form-shell form-shell--narrow">
    <section class="form-card">
      <p class="eyebrow">Chào mừng trở lại</p>
      <h2 class="form-title">Đăng nhập hệ thống</h2>
      <p class="form-subtitle">Quản lý đội xe và đơn thuê trên cùng một bảng điều khiển.</p>

      <div class="message-box is-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form-grid form-grid--single">
        <div class="input-stack">
          <label for="username">Tên đăng nhập</label>
          <input
            class="input-control"
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Tên đăng nhập"
            [disabled]="loading"
            required
          />
        </div>

        <div class="input-stack">
          <label for="password">Mật khẩu</label>
          <input
            class="input-control"
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Nhập mật khẩu"
            [disabled]="loading"
            required
          />
        </div>

        <button
          type="submit"
          class="primary-btn full-width submit-btn"
          [disabled]="loading || !loginForm.valid"
        >
          <span *ngIf="!loading">Đăng nhập</span>
          <span *ngIf="loading">Đang kiểm tra...</span>
        </button>
      </form>
    </section>

    <p class="form-footer">
      Chưa có tài khoản?
      <a class="inline-link" routerLink="/register">Tạo tài khoản ngay</a>
    </p>
  </div>
</div>
