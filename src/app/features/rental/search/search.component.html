<!-- search.component.html -->
<div class="search-container">
  <h2>Tìm kiếm đơn thuê xe</h2>

  <form class="search-form" (ngSubmit)="search()">
    <div class="grid">
      <div class="input-group">
        <input
          name="transactionCode"
          [(ngModel)]="filter.transactionCode"
          placeholder="Mã giao dịch" />
      </div>

      <div class="input-group">
        <input
          name="userId"
          type="number"
          [(ngModel)]="filter.userId"
          placeholder="ID khách hàng"
          [disabled]="isCustomerMode"
          [attr.readonly]="isCustomerMode ? true : null" />
      </div>

      <div class="input-group">
        <input
          name="vehicleId"
          type="number"
          [(ngModel)]="filter.vehicleId"
          placeholder="ID xe" />
      </div>

      <div class="input-group">
  <select
    name="status"
    class="select-input"
    [value]="filter.status || ''"
    (change)="onSelectChange('status', $event)">
    
    <option value="">Tất cả trạng thái</option>
    
    <option *ngFor="let s of statusList" [value]="s.value">
      {{ s.label }}
    </option>

  </select>
</div>
    </div>

    <button
      class="search-btn"
      type="submit"
      [disabled]="loading">
      <span *ngIf="!loading">🔍 Tìm kiếm</span>
      <span *ngIf="loading">⏳ Đang tìm...</span>
    </button>
  </form>

  <div class="results" [class.results--empty]="rentals.length === 0 && !loading">
    <app-rental-card
      *ngFor="let r of rentals"
      [rental]="r"
      (viewDetail)="onViewDetail($event)">
    </app-rental-card>

    <div *ngIf="rentals.length === 0 && !loading" class="no-results">
      <div class="no-results-icon">📝</div>
      <p>Chưa có đơn thuê nào phù hợp.</p>
      <small>Thay đổi bộ lọc để thử lại nhé!</small>
    </div>
  </div>

  <div class="pagination-controls" *ngIf="totalPages > 0 && !loading">
    <button 
      class="page-btn" 
      [disabled]="currentPage === 0" 
      (click)="changePage(currentPage - 1)">
      &laquo; Trước
    </button>
    
    <span class="page-info">
      Trang {{ currentPage + 1 }} / {{ totalPages }}
    </span>
    
    <button 
      class="page-btn" 
      [disabled]="currentPage === totalPages - 1" 
      (click)="changePage(currentPage + 1)">
      Sau &raquo;
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Đang tải dữ liệu...</p>
  </div>
</div>
