<div class="user-layout">
  <header class="user-header">
    <img src="/logo.png" alt="Logo" class="logo">

    <nav class="user-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'vehicle-search'"
        (click)="setTab('vehicle-search')">
        Tìm kiếm xe
      </button>

      <button
        class="tab-btn"
        [class.active]="activeTab === 'rental-history'"
        (click)="setTab('rental-history')">
        Lịch sử thuê xe
      </button>
    </nav>

    <button class="logout-btn" (click)="logout()" title="Đăng xuất">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </header>

  <main class="user-content">
    @switch (activeTab) {
      @case ('vehicle-search') {
        <div class="search-page">
          <app-search role="USER"></app-search>
        </div>
      }

      @case ('rental-history') {
        <div class="rental-history-page">
          <h3>Lịch sử thuê xe của tôi</h3>
          <app-rental-search></app-rental-search>
        </div>
      }
    }
  </main>
</div>
