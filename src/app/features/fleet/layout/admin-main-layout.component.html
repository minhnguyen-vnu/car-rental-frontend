<div class="admin-layout">
  <header class="admin-header">
    <img src="/logo.png" alt="Logo" class="logo">
    

    <nav class="admin-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'vehicle-search'"
        (click)="setTab('vehicle-search')">
        Tìm kiếm xe
      </button>

      <button
        class="tab-btn"
        [class.active]="activeTab === 'vehicle-add'"
        (click)="setTab('vehicle-add')">
        Thêm xe mới
      </button>

      <button
        class="tab-btn"
        [class.active]="activeTab === 'rental-manage'"
        (click)="setTab('rental-manage')">
        Quản lý đơn thuê
      </button>
    </nav>

    <button class="logout-btn" (click)="logout()" title="Đăng xuất">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </header>

  <main class="admin-content">
    @switch (activeTab) {
      @case ('vehicle-search') {
        <app-search role="ADMIN"></app-search>
      }
      @case ('vehicle-add') {
        <div class="add-vehicle-page">
          <h3>Thêm xe mới</h3>
          <app-info-form
            mode="create"
            role="ADMIN"
            (save)="onVehicleAdded()"
            (cancel)="setTab('vehicle-search')">
          </app-info-form>
        </div>
      }
      @case ('rental-manage') {
        <div class="rental-manage-page">
          <h3>Quản lý đơn thuê xe</h3>
          <app-rental-search></app-rental-search>
        </div>
      }
    }
  </main>
</div>
