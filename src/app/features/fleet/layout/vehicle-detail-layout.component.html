<div class="detail-layout">

  <header class="page-header">
    <div class="container">

      <nav class="nav-breadcrumb">
        <button class="btn-back" (click)="router.navigate([mode === 'admin' ? '/admin' : '/user'])">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Quay lại danh sách
        </button>
      </nav>

      <div class="title-action-row">
        <div class="title-wrapper">
          <h1>Chi tiết phương tiện</h1>
        </div>

        <div class="actions-wrapper">
          <ng-container *ngIf="mode === 'admin' && !editMode">
            <button class="btn btn-outline-danger" (click)="confirmDelete()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              Xóa xe
            </button>
            <button class="btn btn-secondary" (click)="startEdit()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Cập nhật
            </button>
          </ng-container>

          <button *ngIf="mode === 'customer'" class="btn-rent-shine" (click)="onRent()">
            <span>Thuê xe ngay</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </header>

  <main class="content-wrapper">
    <div class="container" *ngIf="vehicle && !loading; else loadingTpl">
      <div class="info-card">
        <app-info-form
          [vehicle]="vehicle"
          [mode]="editMode ? 'edit' : 'view'"
          [role]="mode === 'admin' ? 'ADMIN' : 'USER'"
          (save)="onSaved($event)"
          (cancel)="onCancelEdit()">
        </app-info-form>
      </div>
    </div>

    <ng-template #loadingTpl>
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Đang tải dữ liệu...</p>
      </div>
    </ng-template>
  </main>

</div>
