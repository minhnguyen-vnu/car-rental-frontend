<section class="form-card payment-confirm">
  <p class="eyebrow">Xác nhận thanh toán</p>
  <h3>Chuyển sang cổng VNPAY</h3>
  <p>Bạn sẽ được chuyển hướng tới VNPAY để hoàn tất giao dịch an toàn.</p>
  <p class="note">Không cần nhập thông tin thẻ tại đây. Kiểm tra số tiền trước khi tiếp tục.</p>

  <div class="form-actions">
    <button type="button" class="secondary-btn" (click)="onBack()" [disabled]="loading">
      Quay lại
    </button>
    <button type="button" class="primary-btn" (click)="onConfirmPayment()" [disabled]="loading">
      @if (!loading) {
        <span>Đồng ý & Thanh toán</span>
      } @else {
        <span>Đang chuyển hướng...</span>
      }
    </button>
  </div>
</section>
