<div class="payment-page">
  <div class="form-shell form-shell--narrow">
    <section class="form-card payment-summary-card">
      <p class="eyebrow">Thông tin đơn thuê</p>
      <h2 class="form-title">Thanh toán đơn #{{ rentalId }}</h2>
      <p class="form-subtitle">Hoàn tất thanh toán để chúng tôi giữ xe cho bạn.</p>

      <div class="summary-panel">
        <p><strong>Mã đơn:</strong> #{{ rentalId }}</p>
        <p class="total">Số tiền: <strong>{{ amount | number:'1.0-0' }} VND</strong></p>
      </div>
    </section>

    @if (!showPaymentForm) {
      <section class="form-card selection-card">
        <h3>Chọn phương thức thanh toán</h3>
        <p class="section-subtitle">Chúng tôi hỗ trợ thanh toán qua VNPAY.</p>

        <form [formGroup]="selectionForm" (ngSubmit)="onContinue()" class="form-grid form-grid--single selection-form">
          <div class="input-stack">
            <label for="method">Phương thức</label>
            <select id="method" class="select-control" formControlName="method">
              <option *ngFor="let m of methods" [value]="m">{{ m }}</option>
            </select>
          </div>

          <div class="input-stack">
            <label for="provider">Cổng thanh toán</label>
            <select id="provider" class="select-control" formControlName="provider">
              <option *ngFor="let p of providers" [value]="p">{{ p }}</option>
            </select>
          </div>

          <div class="form-actions selection-actions">
            <button type="submit" class="primary-btn">
              Tiếp tục
            </button>
          </div>
        </form>
      </section>
    }

    @if (showPaymentForm) {
      <section>
        <app-payment-form
          [rentalId]="rentalId"
          [amount]="amount"
          (success)="onPaymentSuccess($event)"
          (back)="onBackFromForm()">
        </app-payment-form>
      </section>
    }
  </div>
</div>
